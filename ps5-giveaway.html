.cube3d{transform:scale3d(calc(1 + var(--mp,0)*.12),calc(1 - var(--mp,0)*.5),calc(1 + var(--mp,0)*.12));transition:transform 3.4s cubic-bezier(.5,0,.8,.6)}

background:radial-gradient(circle,#fff 0 1.3px,transparent 2px) 12% 22%/auto no-repeat,radial-gradient(circle,#bfeaff 0 1.6px,transparent 2.4px) 86% 30%/auto no-repeat,radial-gradient(circle,#fff 0 1px,transparent 2px) 24% 78%/auto no-repeat,radial-gradient(circle,#b3d9ff 0 1.4px,transparent 2.2px) 78% 82%/auto no-repeat,radial-gradient(circle,#fff 0 1.2px,transparent 2px) 50% 4%/auto no-repeat;animation:tw 3.2s ease-in-out infinite}

.f{box-shadow:inset 0 0 44px rgba(170,228,255,.5),inset 0 0 4px #fff,inset 0 14px 22px #ffffff22,0 0 26px rgba(120,200,255,.28)}

.vis{height:560px}
.stage{width:290px;height:290px;scale:1.3;translate:0 -22px}

/* ===== v6: realistic ice + visible progressive melting ===== */
.f{overflow:hidden;border:1.5px solid rgba(235,250,255,.9);
background:
linear-gradient(135deg,rgba(225,247,255,.30),rgba(110,185,235,.06) 50%,rgba(235,252,255,.26));

url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.011 .018' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .86  0 0 0 0 .96  0 0 0 0 1  0 0 0 1.7 -.62'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") 0 0/320px 320px,

h+=`<i class="drp" style="left:${l}%;--sz:${sz};--du:${du}s;--dl:${dl}s"></i><i class="rip" style="left:${l}%;--du:${du}s;--dl:${dl}s"></i>`}
dr.innerHTML=h;
const vis=document.getElementById("vis");
const A=new Date(CFG.day1).getTime(),T=CFG.total*864e5;
function upd(){
 const mp=Math.min(1,Math.max(0,(Date.now()-A)/T)),left=Math.round((1-mp)*100);
 const on=3+Math.ceil(mp*7);
 dr.querySelectorAll(".drp,.rip").forEach((e,i)=>e.classList.toggle("off",Math.floor(i/2)>=on));
}
upd();setInterval(upd,60000);
})();
</script>
<script>
/* v8: melt intro + fullscreen iPhone finale */
(()=>{
const root=document.documentElement,A=new Date(CFG.day1).getTime(),T=CFG.total*864e5;
const mp=Math.min(1,Math.max(0,(Date.now()-A)/T));
if(mp<1&&location.hash!="#celebrate"){
 root.style.transition="none";root.style.setProperty("--mp",Math.max(0,mp-.14));void root.offsetWidth;
 setTimeout(()=>{root.style.transition="--mp 6s cubic-bezier(.3,.6,.4,1)";root.style.setProperty("--mp",mp);
  setTimeout(()=>{root.style.transition="--mp 2.5s linear"},6200)},700);
}
const COL=["#1f8bff","#ffffff","#53b1ff","#2ee6ff","#7aa8ff","#b9dcff","#ffc83d"],R=Math.random;
window.showFinale=function(){
 if(document.querySelector(".fin"))return;
 const duo=document.querySelector(".duo");if(!duo)return;
 const f=document.createElement("div");f.className="fin";
 let cf="";for(let i=0;i<110;i++){const e=i%9==0;cf+=`<i class="c2${e?" e":""}" style="--l:${R()*100}%;--w:${e?18+R()*14:7+R()*7}px;--hh:${9+R()*10}px;--c:${COL[i%7]};--d:${3.5+R()*3.5}s;--dl:${1.6+R()*5}s;--x:${(R()-.5)*240}px;--r:${360+R()*720}deg">${e?["🎉","🎊","✨"][i%3]:""}</i>`}
 let sh="";for(let i=0;i<34;i++){const a=Math.PI*2*i/34+R()*.4,d=35+R()*45;sh+=`<i class="shd" style="--s:${14+R()*34}px;--x:${Math.cos(a)*d}vmax;--y:${Math.sin(a)*d*.8}vmin;--r:${(R()-.5)*900}deg"></i>`}
 f.innerHTML=`<div class="r2"></div><div class="gl"></div><div class="fstage"><div class="fl"><div class="spin"><div class="in3">${duo.outerHTML}</div></div></div></div>${sh}${cf}<div class="tt">🎉 مبروك${CFG.winner?" "+CFG.winner:""}! البلايستيشن صار جاهز 🎉<small>انتهى التحدي · 60 يوم</small></div><button class="x" type="button">إغلاق ✕</button><div class="flash"></div>`;
 document.body.appendChild(f);
 const st=f.querySelector(".fstage");
 const sc=Math.min(3.6,innerHeight*.62/250,innerWidth*.8/295);st.style.scale=sc;
 function fw(){if(!f.isConnected)return;const x=8+R()*84,y=14+R()*52,c=COL[Math.floor(R()*7)],ns=[];
  for(let i=0;i<30;i++){const a=Math.PI*2*i/30,d=60+R()*90,n=document.createElement("i");n.className="fwp";
   n.style.cssText=`left:${x}%;top:${y}%;--c:${c};--bx:${Math.cos(a)*d}px;--by:${Math.sin(a)*d}px`;f.appendChild(n);ns.push(n)}
  setTimeout(()=>ns.forEach(n=>n.remove()),1700)}
 setTimeout(()=>{fw();setInterval(fw,1100)},1800);
 f.querySelector(".x").onclick=()=>{f.style.transition="opacity .6s";f.style.opacity=0;setTimeout(()=>f.remove(),650)};
};
})();
</script>
<script>
/* real 3D thickness: dense 1px layers (console slab + controller body) with graded shading */
(()=>{const duo=document.querySelector(".duo");if(!duo)return;
const f=duo.querySelector(".cs.f0"),pd=duo.querySelector(".pd");
if(f){const N=20;for(let i=N;i>=1;i--){const c=f.cloneNode();c.className="cs";
 c.style.transform="translateZ("+(-i*.8)+"px)";
 c.style.filter="brightness("+(.97-.5*Math.pow(i/N,.8))+")"+(i==N?" drop-shadow(0 10px 12px #000b)":"");
 f.before(c)}}
if(pd){const N=13;for(let i=N;i>=1;i--){const c=pd.cloneNode();c.classList.add("th");
 c.style.setProperty("--tz",-i*.95+"px");c.style.setProperty("--bk",(.95-.55*Math.pow(i/N,.8)).toFixed(3));pd.before(c)}}
})();
</script>
