    .profile-3d-ring {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: #FF2D2D;
      border-bottom-color: #FF2D2D;
      animation: spin-slow 4s linear infinite;
      pointer-events: none;
      opacity: 0.4;
    }

    .profile-3d-ring-inner {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 45, 45, 0.3);
      animation: spin-slow 8s linear infinite reverse;
      pointer-events: none;
    }

    .profile-scanner {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(255, 45, 45, 0.2), transparent);
      height: 20%;
      width: 100%;
      top: -20%;
      animation: scan 3s linear infinite;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes scan {
      0% {
        top: -20%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }

    @media (max-width: 767px) {
      .profile-3d-ring,
      .profile-3d-ring-inner,
      .profile-scanner {
        animation: none !important;
        opacity: 0.1 !important; /* Keep visible but static and subdued */
      }
    }

    .tech-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #FF2D2D;
      opacity: 0.6;
      z-index: 25;
    }

    .tech-corner-tl {
      top: -5px;
      left: -5px;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    .tech-corner-tr {
      top: -5px;
      right: -5px;
      border-top-width: 2px;
      border-right-width: 2px;
    }

    .tech-corner-bl {
      bottom: -5px;
      left: -5px;
      border-bottom-width: 2px;
      border-left-width: 2px;
    }

    .tech-corner-br {
      bottom: -5px;
      right: -5px;
